<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abfallkalender</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    body { display: flex; align-items: center; justify-content: center; }
    /* Window onto the calendar section of the embedded page */
    #frame {
      width: 555px;
      height: 398px; /* 5-week month; adjusted in script */
      overflow: hidden;
      position: relative;
      transform-origin: center;
      flex-shrink: 0;
    }
    #frame iframe {
      position: absolute;
      top: -248px;   /* skip navbar, title and location selector */
      left: -30px;
      width: 1200px; /* months side by side; current month is the left one */
      height: 900px;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="frame">
    <iframe src="https://www.abfalltermine-bamberg.de/" scrolling="no" title="Abfalltermine Bamberg"></iframe>
  </div>
  <script>
    const frame = document.getElementById('frame');

    // Fit the window to the number of week rows in the current month
    const now = new Date();
    const offset = (new Date(now.getFullYear(), now.getMonth(), 1).getDay() + 6) % 7; // Monday-first
    const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const weeks = Math.ceil((offset + days) / 7);
    frame.style.height = `${398 + (weeks - 5) * 66}px`;

    // Scale the calendar down to fit narrow viewports
    function fit() {
      const s = Math.min(1, (innerWidth - 32) / 555);
      frame.style.transform = `scale(${s})`;
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
